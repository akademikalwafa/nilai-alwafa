<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi Dokumen · STIS Al Wafa</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=1.0.0">
  <style>
    body { background: var(--bg); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 40px 18px; }
    .head { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; }
    .hasil { padding: 22px; }
    .status { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    .status.ok { background: #F0FDF4; border: 1px solid #BBF7D0; color: #14532D; }
    .status.no { background: #FEF2F2; border: 1px solid #FECACA; color: #7F1D1D; }
    .status .ic { width: 34px; height: 34px; }
    .hash { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><div class="brand-mark">NA</div><div><div class="brand-t">Verifikasi Dokumen Akademik</div><div class="brand-s" id="inst">STIS Al Wafa</div></div></div>
    <div class="card"><div id="isi" class="hasil"><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line" style="width:60%"></div></div></div>
    <form class="card mt-16" id="f" style="padding:16px"><div class="field"><label for="k">Cek kode verifikasi lain</label><div class="row"><input class="input mono" id="k" placeholder="Kode pada dokumen" autocomplete="off"><button class="btn btn-primary">Cek</button></div></div></form>
    <p class="muted center mt-16" style="font-size:12px">Halaman ini hanya menampilkan ringkasan untuk memastikan keaslian dokumen. Data pribadi disamarkan.</p>
  </div>
  <script src="js/config.js?v=1.0.0"></script>
  <script src="js/icons.js?v=1.0.0"></script>
  <script>
    'use strict';
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ic = (n) => '<svg class="ic" viewBox="0 0 24 24">' + (window.ICONS[n] || '') + '</svg>';
    const BL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const tgl = (v) => { const m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/); return m ? Number(m[3]) + ' ' + BL[Number(m[2]) - 1] + ' ' + m[1] + (m[4] ? ' pukul ' + m[4] : '') : esc(v); };
    const URL_GAS = (window.APP_CONFIG || {}).GAS_URL || '';
    async function cek(k) {
      const box = document.getElementById('isi');
      if (!k) { box.innerHTML = '<p class="muted">Pindai QR pada dokumen atau masukkan kode verifikasinya.</p>'; return; }
      box.innerHTML = '<div class="skel skel-line"></div><div class="skel skel-line"></div>';
      try {
        const r = await (await fetch(URL_GAS + '?action=verifikasi&k=' + encodeURIComponent(k))).json();
        if (!r.success) { box.innerHTML = '<div class="status no">' + ic('xc') + '<div><b style="font-size:16px">Tidak terverifikasi</b><div>' + esc(r.message) + '</div></div></div>'; return; }
        const d = r.data, ok = d.status === 'TERBIT';
        if (d.institusi) document.getElementById('inst').textContent = d.institusi;
        box.innerHTML = '<div class="status ' + (ok ? 'ok' : 'no') + '">' + ic(ok ? 'checkc' : 'xc') + '<div><b style="font-size:16px">' + (ok ? 'Dokumen ASLI & berlaku' : 'Dokumen telah DITARIK') + '</b><div>' + (ok ? 'Diterbitkan resmi melalui sistem NILAI – AL WAFA.' : esc(d.catatan || 'Dokumen ini tidak berlaku lagi.')) + '</div></div></div>' +
          '<dl class="dl"><dt>Jenis</dt><dd>' + esc(d.jenis) + '</dd><dt>Judul</dt><dd>' + esc(d.judul) + '</dd>' + (d.nomor ? '<dt>Nomor</dt><dd class="mono">' + esc(d.nomor) + '</dd>' : '') + (d.nama ? '<dt>Nama</dt><dd>' + esc(d.nama) + '</dd>' : '') + (d.nim ? '<dt>NIM</dt><dd class="mono">' + esc(d.nim) + '</dd>' : '') + (d.ipk ? '<dt>IPK</dt><dd>' + esc(d.ipk) + '</dd>' : '') + '<dt>Diterbitkan</dt><dd>' + tgl(d.terbit) + '</dd>' +
          (d.penandatangan || []).map((p) => '<dt>' + esc(p.label) + '</dt><dd>' + esc(p.nama) + '<div class="muted" style="font-size:12.5px">' + esc(p.jabatan) + (p.waktu ? ' · disetujui ' + tgl(p.waktu) : '') + '</div></dd>').join('') + '</dl>' +
          (d.hashPdf ? '<div class="mt-16"><div class="lbl">Sidik jari berkas (SHA-256)</div><div class="hash">' + esc(d.hashPdf) + '</div></div>' : '');
      } catch (e) { box.innerHTML = '<div class="status no">' + ic('warn') + '<div><b>Gagal menghubungi server</b><div>Periksa koneksi internet lalu muat ulang halaman.</div></div></div>'; }
    }
    const k0 = new URLSearchParams(location.search).get('k') || '';
    document.getElementById('k').value = k0.split('-')[0];
    document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const k = document.getElementById('k').value.trim(); history.replaceState(null, '', '?k=' + encodeURIComponent(k)); cek(k); };
    cek(k0);
  </script>
</body>
</html>
